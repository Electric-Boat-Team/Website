name: Link Cloudflare preview

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  issues: write
  pull-requests: read

jobs:
  comment:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Do not check out or execute code from the PR: this event has a write token.
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const branch = context.payload.pull_request.head.ref;
            const previewName = branch.toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '');
            const url = `https://${previewName}-website.vcasado.workers.dev/`;
            const marker = '<!-- cloudflare-branch-preview -->';
            const body = `${marker}\n**Cloudflare preview:** ${url}\n\nThis branch URL serves the latest successful Workers Build. It may be unavailable until the first build finishes.`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
