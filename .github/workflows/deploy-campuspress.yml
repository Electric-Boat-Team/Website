name: Deploy to CampusPress

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campuspress-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'Victor-Casado' && github.triggering_actor == 'Victor-Casado' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Push page content to CampusPress
        env:
          CAMPUSPRESS_BASE_URL: ${{ vars.CAMPUSPRESS_BASE_URL }}
          CAMPUSPRESS_USERNAME: ${{ secrets.CAMPUSPRESS_USERNAME }}
          CAMPUSPRESS_APP_PASSWORD: ${{ secrets.CAMPUSPRESS_APP_PASSWORD }}
        run: npm run deploy:wp

  media-setup:
    if: ${{ github.ref == 'refs/heads/setup/campuspress-media-layout' && github.actor == 'Victor-Casado' && github.triggering_actor == 'Victor-Casado' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Upload approved media and set full-width drafts
        env:
          CAMPUSPRESS_USERNAME: ${{ secrets.CAMPUSPRESS_USERNAME }}
          CAMPUSPRESS_APP_PASSWORD: ${{ secrets.CAMPUSPRESS_APP_PASSWORD }}
          TEMPLATES_ONLY: "true"
        run: node scripts/setup-campuspress-media.mjs
